<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="violetRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="violetRoseText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Icône calendrier -->
  <rect x="3" y="3" width="34" height="34" rx="10" fill="url(#violetRose)" filter="url(#boxShadow)"/>
  
  <g stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none">
    <rect x="8" y="10" width="24" height="20" rx="2"/>
    <line x1="20" y1="6" x2="20" y2="10"/>
    <line x1="12" y1="6" x2="12" y2="10"/>
    <line x1="8" y1="16" x2="32" y2="16"/>
  </g>
  
  <!-- Texte Calenda -->
  <text x="46" y="27" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="-0.03em" fill="#0f0a1e">
    Calenda
  </text>
  
  <!-- Texte Pro (gradient) -->
  <text x="91" y="27" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="-0.03em" fill="url(#violetRoseText)">
    Pro
  </text>
</svg>
